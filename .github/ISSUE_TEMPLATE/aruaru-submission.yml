name: あるあるを投稿
description: DevRevのハマりどころ・回避策を提案する
title: 【あるある投稿】
labels: ["aruaru-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ありがとうございます。内容を確認のうえ、匿名化してサイトに反映します。
        **PRを書く必要はありません。** 以下の項目を記入してください。

  - type: input
    id: title
    attributes:
      label: タイトル（あるあるの一言）
      description: 例「GitHub連携したのにイベントが届かない」
    validations:
      required: true

  - type: textarea
    id: symptom
    attributes:
      label: 症状（何が起きたか）
    validations:
      required: true

  - type: textarea
    id: cause
    attributes:
      label: 原因（わかっている範囲で）
    validations:
      required: false

  - type: textarea
    id: fix
    attributes:
      label: 対処（どうしたら解決したか）
    validations:
      required: true

  - type: input
    id: tags
    attributes:
      label: タグ（カンマ区切り）
      description: 例 GitHub連携, Issue, スナップイン
    validations:
      required: false

  - type: checkboxes
    id: anonymize
    attributes:
      label: 確認
      options:
        - label: 組織名・実名・社内Issue番号など、公開前に匿名化が必要な情報を含んでいる可能性があることを理解しました
          required: true
